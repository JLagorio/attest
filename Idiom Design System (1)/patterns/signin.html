<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Program Assurance</title><link rel="stylesheet" href="../styles.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:var(--space-8) var(--space-6)}.col{width:100%;max-width:392px}</style>
</head><body>
<div class="col">
<div class="brand" style="margin-bottom:var(--space-8)"><div class="brand-mark">PA</div><div class="brand-name">Assurance</div></div>
<h1 class="t-display" style="font-size:38px;line-height:42px;letter-spacing:-1.3px">Sign in</h1>
<p class="t-label" style="margin-top:var(--space-3)">Use your organization account. Access to evidence and determinations follows the authority you already hold.</p>
<div style="display:flex;flex-direction:column;gap:var(--space-4);margin-top:var(--space-7)">
<label class="field"><span>Work email</span><input class="input" type="email" placeholder="you@acme-defense.com" autocomplete="username"></label>
<label class="field"><span>Password</span><input class="input" type="password" placeholder="••••••••••" autocomplete="current-password"></label>
</div>
<button class="btn primary wide" style="margin-top:var(--space-6)">Sign in</button>
<div style="display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-6)"><span class="t-micro">Or</span><button class="btn wide">Continue with ACME single sign-on</button></div>
<p class="t-micro" style="margin-top:var(--space-7)">Trouble signing in? <a class="link" href="#">Ask your assurance owner</a>. Accounts are provisioned by organization unit, not requested.</p>
</div>
</body></html>
