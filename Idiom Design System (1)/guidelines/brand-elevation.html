<!-- @dsCard group="Brand" viewport="700x220" name="Elevation" subtitle="One shadow on the app surface; overlays are the exception" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--canvas);margin:0;padding:22px 24px}</style></head><body>
<div style="display:flex;gap:24px;align-items:flex-start">
<div style="flex:1"><div style="height:96px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-surface)"></div><div class="t-micro" style="margin-top:8px;color:var(--ink);font-weight:600">--shadow-surface</div><div class="t-micro">the app surface, once per screen</div></div>
<div style="flex:1"><div style="height:96px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay)"></div><div class="t-micro" style="margin-top:8px;color:var(--ink);font-weight:600">--shadow-overlay</div><div class="t-micro">dialogs and menus only</div></div>
<div style="flex:1"><div style="height:96px;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--hairline);display:grid;place-items:center"><span class="t-micro">buttons · fields · rows</span></div><div class="t-micro" style="margin-top:8px;color:var(--ink);font-weight:600">no shadow</div><div class="t-micro">controls are flat; cards do not exist</div></div>
</div>
</body></html>
