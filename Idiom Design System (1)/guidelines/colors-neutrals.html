<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface);margin:0;padding:20px 24px}</style></head><body><div style="display:flex;gap:14px"><div style="flex:1;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:#131A2C"></div><div class="t-micro" style="margin-top:6px;color:var(--ink);font-weight:600">--ink</div><div class="t-micro">titles, values, current</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:#3B4761"></div><div class="t-micro" style="margin-top:6px;color:var(--ink);font-weight:600">--ink-secondary</div><div class="t-micro">labels on controls</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:#6B7793"></div><div class="t-micro" style="margin-top:6px;color:var(--ink);font-weight:600">--ink-muted</div><div class="t-micro">captions, headers, nulls</div></div><div style="flex:1;min-width:0"><div style="height:44px;border-radius:var(--radius-md);background:#98A2B5"></div><div class="t-micro" style="margin-top:6px;color:var(--ink);font-weight:600">--ink-faint</div><div class="t-micro">counts, placeholders</div></div></div>
<p class="t-label" style="margin-top:18px">Desaturate the screen: if the structure stops reading, colour was doing the layout's job. Neutrals are blue-tinted — never a true grey.</p>
